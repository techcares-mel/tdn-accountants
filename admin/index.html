<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TDN Admin — Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: #F4F6F9;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      border: 1px solid #E2E8F0;
      box-shadow: 0 4px 24px rgba(0,0,0,.08);
      padding: 2.5rem;
      width: 100%;
      max-width: 400px;
    }
    .logo-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 2rem;
    }
    .logo-wrap img { height: 52px; width: auto; }
    h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 1.5rem;
      font-weight: 800;
      color: #111827;
      text-align: center;
      margin-bottom: .35rem;
    }
    .sub {
      text-align: center;
      font-size: .85rem;
      color: #9CA3AF;
      margin-bottom: 2rem;
    }
    label {
      display: block;
      font-size: .8rem;
      font-weight: 600;
      color: #374151;
      margin-bottom: .4rem;
    }
    input {
      width: 100%;
      padding: .7rem 1rem;
      border: 1px solid #E2E8F0;
      border-radius: 8px;
      font-family: 'Inter', sans-serif;
      font-size: .9rem;
      color: #111827;
      background: #F7F8FC;
      outline: none;
      transition: border-color .2s;
      margin-bottom: 1.1rem;
    }
    input:focus { border-color: #C0272D; background: #fff; }
    button {
      width: 100%;
      padding: .8rem;
      background: linear-gradient(135deg, #C0272D, #E8373E);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-family: 'Inter', sans-serif;
      font-size: .95rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity .2s, transform .2s;
      margin-top: .25rem;
    }
    button:hover { opacity: .9; transform: scale(1.01); }
    button:disabled { opacity: .6; cursor: not-allowed; transform: none; }
    .error {
      background: #FEF2F2;
      border: 1px solid #FECACA;
      color: #B91C1C;
      border-radius: 8px;
      padding: .65rem 1rem;
      font-size: .83rem;
      margin-bottom: 1rem;
      display: none;
    }
    .error.show { display: block; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-wrap">
      <img src="../assets/logo.png" alt="TDN Accountants & Advisers">
    </div>
    <h1>Admin Login</h1>
    <p class="sub">Sign in to manage your website content</p>
    <div class="error" id="error-msg"></div>
    <form id="login-form">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" autocomplete="username" required>
      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required>
      <button type="submit" id="submit-btn">Sign In</button>
    </form>
  </div>

  <script>
    // If already logged in with valid token, go straight to dashboard
    const token = localStorage.getItem('admin_token');
    if (token) {
      try {
        const payload = JSON.parse(atob(token.split('.')[1]));
        if (payload.exp * 1000 > Date.now()) {
          window.location.href = '/admin/dashboard.html';
        }
      } catch {}
    }

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submit-btn');
      const errEl = document.getElementById('error-msg');
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      btn.disabled = true;
      btn.textContent = 'Signing in…';
      errEl.classList.remove('show');

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();

        if (!res.ok) {
          errEl.textContent = data.error || 'Login failed. Please try again.';
          errEl.classList.add('show');
          btn.disabled = false;
          btn.textContent = 'Sign In';
          return;
        }

        localStorage.setItem('admin_token', data.token);
        window.location.href = 'dashboard.html';
      } catch {
        errEl.textContent = 'Network error. Please try again.';
        errEl.classList.add('show');
        btn.disabled = false;
        btn.textContent = 'Sign In';
      }
    });
  </script>
</body>
</html>
