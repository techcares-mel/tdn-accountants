<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 80" width="160" height="80">
  <!-- Red square background -->
  <rect x="0" y="0" width="72" height="72" fill="#8B1A1A" rx="2"/>

  <!-- Vertical divider -->
  <line x1="36" y1="0" x2="36" y2="72" stroke="white" stroke-width="1.5"/>
  <!-- Horizontal divider (top half only) -->
  <line x1="0" y1="36" x2="72" y2="36" stroke="white" stroke-width="1.5"/>

  <!-- Letter t (top-left) -->
  <text x="18" y="29" font-family="Georgia, 'Times New Roman', serif" font-size="22"
        fill="white" text-anchor="middle" font-style="italic">t</text>

  <!-- Letter d (top-right) -->
  <text x="54" y="29" font-family="Georgia, 'Times New Roman', serif" font-size="22"
        fill="white" text-anchor="middle" font-style="italic">d</text>

  <!-- Letter n (bottom, full width) -->
  <text x="36" y="63" font-family="Georgia, 'Times New Roman', serif" font-size="22"
        fill="white" text-anchor="middle" font-style="italic">n</text>

  <!-- Company name to the right of square -->
  <text x="82" y="34" font-family="Arial, sans-serif" font-size="11"
        fill="#8B1A1A" font-weight="600" letter-spacing="0.3">Accountants &amp;</text>
  <text x="82" y="50" font-family="Arial, sans-serif" font-size="11"
        fill="#8B1A1A" font-weight="600" letter-spacing="0.3">Advisers</text>
</svg>
